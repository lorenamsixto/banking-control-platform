services:
  db:
    image: postgres:17
    container_name: banking_db
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: banking_backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      - db
  
  frontend:
    build:
      context: ./frontend

    container_name: banking_frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  postgres_data: