services:
  db:
    image: postgres:17
    container_name: banking_db

    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - database_net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U banking_user -d banking_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend

    container_name: banking_backend

    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

    ports:
      - "8000:8000"

    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    depends_on:
      db:
        condition: service_healthy

    networks:
      - frontend_net
      - database_net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=2)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  frontend:
    build:
      context: ./frontend

    container_name: banking_frontend

    command: npm run dev -- --host 0.0.0.0

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - frontend_net


volumes:
  postgres_data:


networks:
  frontend_net:
    driver: bridge

  database_net:
    driver: bridge
    internal: true